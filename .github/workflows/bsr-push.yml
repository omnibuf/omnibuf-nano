name: Push Proto to BSR

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsr-push:
    name: Lint, Breaking Check, and Push to BSR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          token: ${{ secrets.BUF_TOKEN }}

      - name: Lint proto
        run: buf lint

      - name: Check breaking changes against BSR
        run: |
          if buf ls-files "buf.build/omnibuf/nano" >/dev/null 2>&1; then
            buf breaking --against "buf.build/omnibuf/nano"
          else
            echo "BSR module buf.build/omnibuf/nano has no commits yet; skipping breaking check on initial push."
          fi

      - name: Push to BSR
        run: buf push
