syntax = "proto3";

package omnibuf.nano.test;

import "omnibuf/nano/v1/options.proto";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_ERROR = 2;
}

message Nested {
  int32 id = 1;
  string label = 2 [(omnibuf.nano.v1.field).max_size = 32];
  bool active = 3;
}

message SkippedDebug {
  option (omnibuf.nano.v1.message).skip_message = true;
  string debug_dump = 1;
}

message ConformanceMsg {
  uint32 f_uint32 = 1;
  uint64 f_uint64 = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  fixed32 f_fixed32 = 7;
  fixed64 f_fixed64 = 8;
  sfixed32 f_sfixed32 = 9;
  sfixed64 f_sfixed64 = 10;
  float f_float = 11;
  double f_double = 12;
  bool f_bool = 13;
  Status f_enum = 14;

  string f_string = 15 [(omnibuf.nano.v1.field).max_size = 64];
  bytes f_bytes = 16 [(omnibuf.nano.v1.field).max_size = 32];
  bytes f_fixed_bytes = 17 [(omnibuf.nano.v1.field) = {
    max_size: 8
    fixed_length: true
  }];

  optional bool f_opt_bool = 18;
  optional int32 f_opt_int32 = 19;

  Nested f_nested = 20;

  repeated uint32 f_rep_uint32 = 21 [(omnibuf.nano.v1.field).max_count = 8];
  repeated string f_rep_string = 22; // Bounds supplied via conformance.options sidecar
  repeated bytes f_rep_bytes = 23;   // Bounds supplied via conformance.options sidecar
  repeated Nested f_rep_nested = 24 [(omnibuf.nano.v1.field).max_count = 4];

  oneof payload {
    int32 oneof_int = 25;
    string oneof_str = 26 [(omnibuf.nano.v1.field).max_size = 32];
    Nested oneof_nested = 27;
  }

  map<string, uint64> f_map_str_u64 = 28; // Bounds supplied via conformance.options sidecar
  map<int32, Nested> f_map_i32_msg = 29 [(omnibuf.nano.v1.field).max_count = 4];
}
